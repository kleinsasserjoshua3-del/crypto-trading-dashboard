<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Trading Dashboard - Kraken</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            border: 1px solid rgba(0,255,100,0.3);
        }
        
        h1 {
            font-size: 28px;
            color: #00ff64;
            text-shadow: 0 0 10px rgba(0,255,100,0.5);
        }
        
        .status-indicator {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            background: rgba(0,0,0,0.5);
            border-radius: 5px;
            border: 1px solid rgba(0,255,100,0.2);
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00ff64;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .metric-card {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(0,255,100,0.3);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
        
        .metric-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .metric-value {
            font-size: 24px;
            color: #00ff64;
            font-weight: bold;
        }
        
        .section {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(0,255,100,0.2);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 18px;
            color: #00ff64;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0,255,100,0.2);
        }
        
        .bots-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .bot-card {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(0,255,100,0.3);
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
        }
        
        .bot-card:hover {
            border-color: rgba(0,255,100,0.6);
            box-shadow: 0 0 20px rgba(0,255,100,0.2);
        }
        
        .bot-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .bot-name {
            font-size: 16px;
            font-weight: bold;
            color: #00ff64;
        }
        
        .bot-status {
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 12px;
            background: rgba(0,255,100,0.2);
            color: #00ff64;
        }
        
        .bot-status.inactive {
            background: rgba(255,0,0,0.2);
            color: #ff6b6b;
        }
        
        .bot-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 12px;
        }
        
        .stat {
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 5px;
            border-left: 2px solid #00ff64;
        }
        
        .stat-label {
            color: #888;
            font-size: 10px;
            text-transform: uppercase;
        }
        
        .stat-value {
            color: #00ff64;
            font-weight: bold;
            margin-top: 5px;
        }
        
        .controls {
            display: grid;
            gap: 15px;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .control-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
        }
        
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        input[type="range"] {
            flex: 1;
            height: 5px;
            border-radius: 5px;
            background: rgba(0,255,100,0.2);
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #00ff64;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,255,100,0.5);
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #00ff64;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(0,255,100,0.5);
        }
        
        .slider-value {
            min-width: 50px;
            text-align: right;
            color: #00ff64;
            font-weight: bold;
        }
        
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        button {
            padding: 10px 15px;
            border: 1px solid rgba(0,255,100,0.3);
            border-radius: 5px;
            background: rgba(0,255,100,0.1);
            color: #00ff64;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 12px;
            text-transform: uppercase;
        }
        
        button:hover {
            background: rgba(0,255,100,0.2);
            border-color: rgba(0,255,100,0.6);
            box-shadow: 0 0 10px rgba(0,255,100,0.3);
        }
        
        button.danger {
            border-color: rgba(255,0,0,0.3);
            background: rgba(255,0,0,0.1);
            color: #ff6b6b;
        }
        
        button.danger:hover {
            background: rgba(255,0,0,0.2);
            border-color: rgba(255,0,0,0.6);
            box-shadow: 0 0 10px rgba(255,0,0,0.3);
        }
        
        .emergency-stop {
            width: 100%;
            padding: 20px;
            background: rgba(255,0,0,0.15);
            border: 2px solid #ff6b6b;
            border-radius: 8px;
            color: #ff6b6b;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        
        .emergency-stop:hover {
            background: rgba(255,0,0,0.25);
            box-shadow: 0 0 20px rgba(255,0,0,0.5);
        }
        
        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 20px;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #888;
        }
        
        .error {
            background: rgba(255,0,0,0.1);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .success {
            background: rgba(0,255,100,0.1);
            border: 1px solid #00ff64;
            color: #00ff64;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Crypto Trading Dashboard - Kraken</h1>
            <div class="status-indicator">
                <div class="status-item">
                    <div class="status-dot"></div>
                    <span>System: <strong id="system-status">Loading...</strong></span>
                </div>
                <div class="status-item">
                    <span>Balance: <strong id="balance">$0.00</strong></span>
                </div>
            </div>
        </header>

        <!-- Emergency Stop -->
        <button class="emergency-stop" onclick="emergencyStop()">🛑 EMERGENCY STOP - CLOSE ALL POSITIONS</button>

        <!-- System Messages -->
        <div id="message-container"></div>

        <!-- Metrics -->
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">Total Profit</div>
                <div class="metric-value" id="total-profit">$0.00</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Active Bots</div>
                <div class="metric-value" id="active-bots">0/5</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Total Trades</div>
                <div class="metric-value" id="total-trades">0</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Win Rate</div>
                <div class="metric-value" id="win-rate">0%</div>
            </div>
        </div>

        <!-- Bot Controls Section -->
        <div class="section">
            <div class="section-title">🤖 Bot Management & Controls</div>
            <div class="bots-container" id="bots-container">
                <div class="loading">Loading bots...</div>
            </div>
        </div>

        <!-- System Health -->
        <div class="section">
            <div class="section-title">📊 System Health</div>
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-label">API Calls</div>
                    <div class="metric-value" id="api-calls">0</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Trades Executed</div>
                    <div class="metric-value" id="trades-executed">0</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Uptime</div>
                    <div class="metric-value" id="uptime">0h</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Circuit Breaker</div>
                    <div class="metric-value" id="circuit-breaker">Active</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE = window.location.origin;
        const REFRESH_INTERVAL = 5000; // 5 seconds

        // State
        let botsData = {};
        let systemHealth = {};

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadDashboard();
            setInterval(loadDashboard, REFRESH_INTERVAL);
        });

        // Main dashboard load
        async function loadDashboard() {
            try {
                await Promise.all([
                    loadBots(),
                    loadSystemHealth(),
                    loadBalance()
                ]);
                updateMetrics();
            } catch (error) {
                console.error('Dashboard error:', error);
                showMessage('Error loading dashboard', 'error');
            }
        }

        // Load bots
        async function loadBots() {
            try {
                const response = await fetch(`${API_BASE}/api/bots`);
                const data = await response.json();
                botsData = data;
                renderBots(data);
            } catch (error) {
                console.error('Error loading bots:', error);
            }
        }

        // Render bot cards
        function renderBots(bots) {
            const container = document.getElementById('bots-container');
            
            if (!bots || Object.keys(bots).length === 0) {
                container.innerHTML = '<div class="loading">No bots available</div>';
                return;
            }

            container.innerHTML = Object.entries(bots).map(([botId, bot]) => `
                <div class="bot-card">
                    <div class="bot-header">
                        <div class="bot-name">${formatBotName(botId)}</div>
                        <div class="bot-status ${bot.active ? '' : 'inactive'}">
                            ${bot.active ? '🟢 RUNNING' : '🔴 STOPPED'}
                        </div>
                    </div>

                    <div class="bot-stats">
                        <div class="stat">
                            <div class="stat-label">Win Rate</div>
                            <div class="stat-value">${(bot.win_rate || 0).toFixed(1)}%</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Profit</div>
                            <div class="stat-value">$${(bot.profit || 0).toFixed(2)}</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Trades</div>
                            <div class="stat-value">${bot.trades || 0}</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Position Size</div>
                            <div class="stat-value">${(bot.position_size || 0).toFixed(1)}%</div>
                        </div>
                    </div>

                    <div class="controls">
                        <div class="control-group">
                            <label class="control-label">Position Size: ${(bot.position_size || 0).toFixed(1)}%</label>
                            <div class="slider-container">
                                <input type="range" min="1" max="50" value="${bot.position_size || 10}" 
                                    onchange="updateBotParameter('${botId}', 'position_size', this.value)">
                                <span class="slider-value">${(bot.position_size || 10).toFixed(1)}%</span>
                            </div>
                        </div>

                        <div class="control-group">
                            <label class="control-label">Aggressiveness: ${bot.aggressiveness || 5}/10</label>
                            <div class="slider-container">
                                <input type="range" min="1" max="10" value="${bot.aggressiveness || 5}" 
                                    onchange="updateBotParameter('${botId}', 'aggressiveness', this.value)">
                                <span class="slider-value">${bot.aggressiveness || 5}/10</span>
                            </div>
                        </div>

                        <div class="control-group">
                            <label class="control-label">Stop Loss: ${(bot.stop_loss || 0).toFixed(2)}%</label>
                            <div class="slider-container">
                                <input type="range" min="0.1" max="10" step="0.1" value="${bot.stop_loss || 2}" 
                                    onchange="updateBotParameter('${botId}', 'stop_loss', this.value)">
                                <span class="slider-value">${(bot.stop_loss || 2).toFixed(2)}%</span>
                            </div>
                        </div>

                        <div class="control-group">
                            <label class="control-label">Take Profit: ${(bot.take_profit || 0).toFixed(2)}%</label>
                            <div class="slider-container">
                                <input type="range" min="0.1" max="20" step="0.1" value="${bot.take_profit || 5}" 
                                    onchange="updateBotParameter('${botId}', 'take_profit', this.value)">
                                <span class="slider-value">${(bot.take_profit || 5).toFixed(2)}%</span>
                            </div>
                        </div>

                        <div class="button-group">
                            <button onclick="toggleBot('${botId}')">${bot.active ? '⏸ Pause' : '▶ Start'}</button>
                            <button onclick="resetBot('${botId}')">🔄 Reset</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Load system health
        async function loadSystemHealth() {
            try {
                const response = await fetch(`${API_BASE}/api/system/health`);
                systemHealth = await response.json();
            } catch (error) {
                console.error('Error loading system health:', error);
            }
        }

        // Load balance
        async function loadBalance() {
            try {
                const response = await fetch(`${API_BASE}/api/exchange/balance`);
                const data = await response.json();
                document.getElementById('balance').textContent = `$${(data.total || 0).toFixed(2)}`;
            } catch (error) {
                console.error('Error loading balance:', error);
            }
        }

        // Update metrics
        function updateMetrics() {
            let totalProfit = 0;
            let activeBots = 0;
            let totalTrades = 0;
            let totalWins = 0;
            let totalTradeSamples = 0;

            Object.values(botsData).forEach(bot => {
                totalProfit += bot.profit || 0;
                if (bot.active) activeBots++;
                totalTrades += bot.trades || 0;
                totalWins += (bot.trades || 0) * (bot.win_rate || 0) / 100;
                totalTradeSamples += bot.trades || 0;
            });

            document.getElementById('total-profit').textContent = `$${totalProfit.toFixed(2)}`;
            document.getElementById('active-bots').textContent = `${activeBots}/5`;
            document.getElementById('total-trades').textContent = totalTrades;
            document.getElementById('win-rate').textContent = totalTradeSamples > 0 ? 
                `${(totalWins / totalTradeSamples * 100).toFixed(1)}%` : '0%';

            // System health
            document.getElementById('api-calls').textContent = systemHealth.api_calls || 0;
            document.getElementById('trades-executed').textContent = systemHealth.trades_executed || 0;
            document.getElementById('uptime').textContent = `${(systemHealth.uptime_hours || 0).toFixed(1)}h`;
            document.getElementById('circuit-breaker').textContent = systemHealth.circuit_breaker_status || 'Active';
            document.getElementById('system-status').textContent = systemHealth.status || 'Running';
        }

        // Update bot parameter
        async function updateBotParameter(botId, parameter, value) {
            try {
                const response = await fetch(`${API_BASE}/api/bots/${botId}/parameters`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ [parameter]: parseFloat(value) })
                });
                
                if (response.ok) {
                    showMessage(`${formatBotName(botId)} ${parameter} updated to ${value}`, 'success');
                    await loadBots();
                } else {
                    showMessage('Failed to update parameter', 'error');
                }
            } catch (error) {
                console.error('Error updating parameter:', error);
                showMessage('Error updating parameter', 'error');
            }
        }

        // Toggle bot
        async function toggleBot(botId) {
            try {
                const response = await fetch(`${API_BASE}/api/bots/${botId}/toggle`, {
                    method: 'POST'
                });
                
                if (response.ok) {
                    await loadBots();
                    showMessage(`${formatBotName(botId)} toggled`, 'success');
                } else {
                    showMessage('Failed to toggle bot', 'error');
                }
            } catch (error) {
                console.error('Error toggling bot:', error);
                showMessage('Error toggling bot', 'error');
            }
        }

        // Reset bot
        async function resetBot(botId) {
            if (!confirm(`Reset ${formatBotName(botId)} to defaults?`)) return;
            
            try {
                const response = await fetch(`${API_BASE}/api/bots/${botId}/reset`, {
                    method: 'POST'
                });
                
                if (response.ok) {
                    await loadBots();
                    showMessage(`${formatBotName(botId)} reset to defaults`, 'success');
                } else {
                    showMessage('Failed to reset bot', 'error');
                }
            } catch (error) {
                console.error('Error resetting bot:', error);
                showMessage('Error resetting bot', 'error');
            }
        }

        // Emergency stop
        async function emergencyStop() {
            if (!confirm('⚠️ EMERGENCY STOP - Close all positions immediately?')) return;
            
            try {
                const response = await fetch(`${API_BASE}/api/risk/emergency-stop`, {
                    method: 'POST'
                });
                
                if (response.ok) {
                    showMessage('🛑 EMERGENCY STOP ACTIVATED - All positions closed', 'error');
                    await loadDashboard();
                } else {
                    showMessage('Failed to execute emergency stop', 'error');
                }
            } catch (error) {
                console.error('Error executing emergency stop:', error);
                showMessage('Error executing emergency stop', 'error');
            }
        }

        // Show message
        function showMessage(text, type) {
            const container = document.getElementById('message-container');
            const message = document.createElement('div');
            message.className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'error';
            message.textContent = text;
            container.appendChild(message);
            
            setTimeout(() => message.remove(), 5000);
        }

        // Format bot name
        function formatBotName(botId) {
            const names = {
                'adaptive_grid': '📊 Adaptive Grid Trader',
                'momentum_tracker': '📈 Momentum Tracker',
                'dca_accumulator': '💰 DCA Accumulator',
                'scalp_master': '⚡ Scalp Master',
                'arb_finder': '🔄 Arbitrage Finder'
            };
            return names[botId] || botId;
        }
    </script>
</body>
</html>
